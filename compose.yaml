services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: rerev
      POSTGRES_USER: rerev
      POSTGRES_PASSWORD: rerev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rerev -d rerev"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rerev-postgres:/var/lib/postgresql/data

  nex:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PN_REREV_AUTH_PORT: "29100"
      PN_REREV_SECURE_PORT: "29101"
      # The address a console is told to reach the secure server on. Override
      # in .env or the shell; defaults to localhost for a LAN test.
      PN_REREV_SECURE_HOST: ${PN_REREV_SECURE_HOST:-localhost}
      PN_REREV_POSTGRES_URI: postgres://rerev:rerev@postgres:5432/rerev?sslmode=disable
      PN_REREV_KERBEROS_PASSWORD: ${PN_REREV_KERBEROS_PASSWORD:-change-me}
      # Local preservation mode: accounts from settings.json, login token not
      # validated. Flip to shared mode by setting PN_REREV_LOCAL_MODE=0 and
      # providing the two NEX_* secrets (matching your account server).
      PN_REREV_LOCAL_MODE: ${PN_REREV_LOCAL_MODE:-1}
      PN_REREV_SETTINGS_PATH: /home/go/app/settings.json
      PN_REREV_NEX_TOKEN_AES_KEY: ${PN_REREV_NEX_TOKEN_AES_KEY:-}
      PN_REREV_NEX_PASSWORD_SECRET: ${PN_REREV_NEX_PASSWORD_SECRET:-}
    ports:
      - "29100:29100/udp"
      - "29101:29101/udp"
    volumes:
      - ./settings.json:/home/go/app/settings.json:ro

volumes:
  rerev-postgres:
